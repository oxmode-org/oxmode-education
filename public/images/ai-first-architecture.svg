<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B061A"/>
      <stop offset="0.5" stop-color="#12092E"/>
      <stop offset="1" stop-color="#080314"/>
    </linearGradient>
    <radialGradient id="glowTop" cx="600" cy="100" r="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#380995" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0B061A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBot" cx="600" cy="550" r="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2EFCFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0B061A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2EFCFF" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#8E70F5" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#380995" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="boxShadow" x="-10" y="-10" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="600" cy="100" r="400" fill="url(#glowTop)"/>
  <circle cx="600" cy="550" r="350" fill="url(#glowBot)"/>

  <!-- Grid lines -->
  <g stroke="#8E70F5" stroke-opacity="0.07" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="350" y1="0" x2="350" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="850" y1="0" x2="850" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="55" text-anchor="middle" fill="#2EFCFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.2em">OXMODE SYSTEM ARCHITECTURE</text>
  <text x="600" y="88" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700">Kiến Trúc Hệ Thống Vận Hành AI-First</text>

  <!-- Flow Connectors -->
  <g stroke="#2EFCFF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6">
    <path d="M600 185 V 225"/>
    <path d="M600 325 V 365"/>
    <path d="M600 465 V 505"/>
  </g>
  <polygon points="600,230 596,220 604,220" fill="#2EFCFF"/>
  <polygon points="600,370 596,360 604,360" fill="#2EFCFF"/>
  <polygon points="600,510 596,500 604,500" fill="#2EFCFF"/>

  <!-- TIER 1: CON NGƯỜI (STRATEGY & APPROVAL) -->
  <g transform="translate(250, 115)">
    <rect width="700" height="70" rx="14" fill="#170E38" fill-opacity="0.85" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <circle cx="45" cy="35" r="18" fill="#380995"/>
    <path d="M40 38C40 34 43 32 45 32C47 32 50 34 50 38M45 28C43.5 28 42.5 26.8 42.5 25.5C42.5 24.2 43.5 23 45 23C46.5 23 47.5 24.2 47.5 25.5C47.5 26.8 46.5 28 45 28Z" stroke="#2EFCFF" stroke-width="1.8" stroke-linecap="round"/>
    <text x="80" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tầng 1: Con Người (Human-in-the-Loop)</text>
    <text x="80" y="49" fill="#8E70F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Ra quyết định chiến lược • Duyệt hành động &amp; chi phí • Giám sát ngoại lệ quy trình</text>
  </g>

  <!-- TIER 2: AI AGENTS & CO-PILOTS -->
  <g transform="translate(250, 255)">
    <rect width="700" height="70" rx="14" fill="#1C1045" fill-opacity="0.9" stroke="url(#borderGrad)" stroke-width="1.5"/>
    <circle cx="45" cy="35" r="18" fill="#380995"/>
    <path d="M38 35L45 28L52 35M45 28V42" stroke="#2EFCFF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="45" cy="35" r="3" fill="#5BD3A8"/>
    <text x="80" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tầng 2: Nhân Viên Số &amp; AI Agents (Hermes Agent)</text>
    <text x="80" y="49" fill="#2EFCFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Trích xuất văn bản (OCR) • Trợ lý điều phối quy trình • Phân tích &amp; soạn thảo báo cáo tự động</text>
  </g>

  <!-- TIER 3: NOCOBASE CORE PLATFORM -->
  <g transform="translate(250, 395)">
    <rect width="700" height="70" rx="14" fill="#170E38" fill-opacity="0.85" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <circle cx="45" cy="35" r="18" fill="#380995"/>
    <rect x="37" y="27" width="16" height="16" rx="3" stroke="#2EFCFF" stroke-width="1.8"/>
    <line x1="37" y1="34" x2="53" y2="34" stroke="#2EFCFF" stroke-width="1.5"/>
    <line x1="44" y1="34" x2="44" y2="43" stroke="#2EFCFF" stroke-width="1.5"/>
    <text x="80" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tầng 3: Nền Tảng Dữ Liệu Tập Trung (NocoBase Core + PostgreSQL)</text>
    <text x="80" y="49" fill="#8E70F5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Cơ sở dữ liệu quan hệ • Phân quyền ma trận vai trò (RBAC) • Giao diện nghiệp vụ không mã</text>
  </g>

  <!-- TIER 4: AUTOMATION & INTEGRATION -->
  <g transform="translate(250, 535)">
    <rect width="700" height="70" rx="14" fill="#170E38" fill-opacity="0.85" stroke="url(#borderGrad)" stroke-width="1.2"/>
    <circle cx="45" cy="35" r="18" fill="#380995"/>
    <path d="M37 35H41L44 28L47 42L50 35H53" stroke="#5BD3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="30" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Tầng 4: Tự Động Hóa &amp; Tích Hợp (Make / Webhooks / API)</text>
    <text x="80" y="49" fill="#5BD3A8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Đồng bộ đa kênh (Zalo, Email, POS, Kế toán) • Webhook tức thời • Chuyển giao dữ liệu liên tục</text>
  </g>
</svg>